version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sse-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
      POSTGRES_DB: event_registration_db
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/02_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_registration_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-tier

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sse-backend-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgres_secure_pass_2026@postgres:5432/event_registration_db
      SECRET_KEY: ${SECRET_KEY:-e59d9c9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend-tier
      - frontend-tier

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sse-frontend-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - frontend-tier

networks:
  backend-tier:
    driver: bridge
  frontend-tier:
    driver: bridge

volumes:
  pgdata:
    driver: local
