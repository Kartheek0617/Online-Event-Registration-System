# Kubernetes Secret Template (Example only - DO NOT commit real secrets)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sse-event-system
type: Opaque
stringData:
  # Base64 encoded or stringData representations
  SECRET_KEY: "change-this-to-a-cryptographically-random-32-byte-hex-string"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "replace_with_strong_k8s_secret_password"
  DATABASE_URL: "postgresql://postgres:replace_with_strong_k8s_secret_password@postgres-service:5432/event_registration_db"
